services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plasticworld-app
    restart: unless-stopped
    env_file:
      - .env.production.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads_data:/app/public/uploads
      - logs_data:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - plasticworld-prod

  postgres:
    image: postgres:15-alpine
    container_name: plasticworld-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-plasticworld_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-plasticworld_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plasticworld-prod

  redis:
    image: redis:7-alpine
    container_name: plasticworld-redis
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes
        fi
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plasticworld-prod

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  logs_data:

networks:
  plasticworld-prod:
    driver: bridge
